# sqlc generates packages/db/gen from infra/migrations (the schema) and
# packages/db/queries (hand-written, reviewed SQL). AGENTS.md: "Queries via
# sqlc — never string-concatenated SQL." This file is why that rule is
# enforceable rather than aspirational — a query that isn't valid against the
# real schema fails `make db-generate` and CI, not a code review someone might
# skip.
#
# Run with `make db-generate`, which invokes the pinned sqlc/sqlc Docker image
# so codegen is reproducible without every contributor installing a matching
# sqlc binary — the same reasoning as pinning golang-migrate in
# infra/compose/*.yml.
version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "../../infra/migrations"
    gen:
      go:
        package: "db"
        out: "gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
