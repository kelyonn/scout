[project]
name = "scout-riverpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kelyonn", email = "kalyan15122005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.3.4",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true
