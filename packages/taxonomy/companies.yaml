# Company taxonomy — docs/07-normalization-taxonomy.md's company_type
# registry, docs/09-ranking-scoring.md section 3.3's own note that
# `company_type` "appears in no [company_quality] term... never a ranking
# input, in either direction" (adapter selection, scheduling, competition
# estimation, coverage auditing only).
#
# Scoped to the ~74 companies actually in infra/seed/sources.sql (P1's 73
# plus Thoughtworks, live-verified for this pass), not a fabricated
# 400-entry registry — see the plan's own scope decision on this. EPAM,
# Globant, Nagarro, and Publicis Sapient (also named in the roadmap) were
# checked live against all three adapters and none resolved — they are not
# on Greenhouse, Lever, or Ashby under any guessed slug, so they aren't
# addressable by this pass's adapters and are left out rather than guessed.
#
# `well_known` is this file's own field, not part of docs/07's
# company_type schema — used only by competition_estimate's
# brand-recognition proxy (docs/09 section 3.9: "-25 company is widely
# known... uses brand recognition, not size"), since P2 has no live
# GitHub-stars/press-mentions data source to compute that signal from.
# Deliberately excluded from feeding company_quality, matching docs/09's
# own "company_type appears in no term" rule for that score.
#
# hq_country is ISO 3166-1 alpha-2. Every company sourced through this
# project's three ATS adapters happens to be a venture-backed product
# company except Thoughtworks — an accurate reflection of what
# Greenhouse/Lever/Ashby actually skew toward, not a labeling shortcut.

