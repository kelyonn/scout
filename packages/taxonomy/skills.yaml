# Curated skill ontology. docs/07-normalization-taxonomy.md section 8 calls
# for ~1,200 entries with alias and `implies` edges. This is the P1
# scope-down: languages, frameworks, and tools common in SWE internship
# postings, enough for skill_match (docs/09 section 3.1) to mean something.
# `implies` is out of scope for P1 — coverage(s) uses only direct
# user_level(s) matches, not the implied-skill credit the formula allows for.
# Extend this file directly; the loader
# (apps/collector/internal/skills/skills.go) does not change.
#
# Matching is alias word-boundary, case-insensitive, over title +
# requirements + description text (apps/collector/internal/skills). Section
# weighting from docs/07 section 8 ("Requirements counts double") is not
# implemented — every match is treated as w(s) = 1.0 ("required"), a
# documented P1 simplification.

