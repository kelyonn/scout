# Curated location gazetteer. docs/07-normalization-taxonomy.md section 6
# calls for GeoNames (cities > 15k population) plus a curated India
# supplement, ~50MB. This is the P1 scope-down: enough cities to correctly
# tier every posting the seeded Greenhouse boards actually produce, not the
# full catalog. Extend this file directly as new cities show up in real
# postings — the loader (packages/taxonomy/locations.go) does not change.
#
# tier is NOT stored here: tier 1 is "Bengaluru, physically" and tier 2 is
# "anywhere else in India" per docs/07 section 6's table, so tiering is a
# function of (country, is_bengaluru), computed in
# apps/collector/internal/normalize/location.go. Tier 3 (remote) and tier 4's
# ±0.05 visa modifier are not properties of a place at all.
#
# canonical: the display form. aliases: what sources actually write,
# lowercased for matching. region: state/province. country: ISO 3166-1
# alpha-2.

- canonical: Bengaluru
  aliases: [bengaluru, bangalore, blr, bengaluru urban]
  region: Karnataka
  country: IN
  is_bengaluru: true

# Bengaluru localities. A posting that says "Whitefield" or "Electronic
# City" without ever saying "Bengaluru" is still a Tier 1 opportunity —
# docs/07 section 6 names these explicitly.
- canonical: Bengaluru
  aliases:
    - whitefield
    - electronic city
    - koramangala
    - indiranagar
    - hsr layout
    - marathahalli
    - bellandur
    - jp nagar
    - yelahanka
    - sarjapur
    - hebbal
    - btm layout
    - jayanagar
    - rajajinagar
    - malleswaram
  region: Karnataka
  country: IN
  is_bengaluru: true

