# docs/07 section 4's own literal YAML for advocacy.devrel, verbatim.
advocacy.devrel:
  strong:
    - developer advocate
    - developer relations
    - developer evangelist
    - devrel
    - developer educator
    - community engineer
  weak:
    - technical community manager
    - developer community.*engineer
  negative:
    - developer marketing
    - community manager$
    - social media
    - content marketing
    - growth marketing
    - technical recruit
    - partnerships? manager
    - customer success manager
  requires: technical_evidence

# Inward-facing tooling for *external* developers (SDKs, docs
# infrastructure, sample applications, developer portals) — docs/07
# section 4: "sits closest to swe.infra.platform and is often mislabelled
# as it." Checked before swe.infra.platform so a title that actually names
# this family isn't absorbed by the more generic pattern.
advocacy.devex:
  strong:
    - developer experience engineer
    - developer experience
    - devex engineer
    - sdk engineer
    - developer portal engineer
  weak:
    - api documentation.*engineer
    - sample app.*engineer
  requires: technical_evidence

# Customer-facing engineering: pre-sales technical work, deployments,
# integrations — docs/07 section 4, Hazard 2: "'Sales Engineer' with a
# quota and no technical requirement is a sales job; 'Sales Engineer'
# building integration prototypes is engineering. The description decides,
# not the title" — exactly what requires: technical_evidence enforces here.
advocacy.solutions:
  strong:
    - solutions engineer
    - sales engineer
    - field engineer
    - solutions architect
    - forward deployed engineer
    - implementation engineer
    - technical consultant
  negative:
    - account executive
    - business development
    - customer success manager
  requires: technical_evidence

# The catch-all leaf: general software-engineering titles that don't name a
# specialization. Checked last among strong patterns so a title like "Backend
# Software Engineer Intern" matches swe.backend first.
swe.general:
  exemplars:
    - Software Engineering Intern
    - Software Engineer Intern, Summer 2027
    - SWE Intern
    - Software Development Engineer Intern
    - Member of Technical Staff, Intern
  strong:
    - software engineer
    - software engineering intern
    - software development engineer
    - sde
    - swe intern
    - member of technical staff
    - programmer analyst
  weak:
    - engineering intern
    - software.*intern

# --- Beyond software (ADR-020, 2026-10-21) ---
# docs/01-prd.md section 4.3 no longer excludes these. Every family below
# carries `is_software: false` explicitly (roles.go defaults the key to
# true when absent, so none of the swe.*/advocacy.* families above needed
# editing). None carries `requires: technical_evidence` — unlike
# advocacy.*, a Product/Consulting/Business title is non-technical by the
# title itself, with no description-level gate needed, so Tier 0 resolves
# these directly and Tier 2's LLM escalation (which only advocacy.*
# triggers) never sees them.

product.management:
  exemplars:
    - Product Management Intern
    - Associate Product Manager Intern
    - Product Manager Intern
    - Product Owner Intern
  strong:
    - product manager
    - associate product manager
    - \bapm\b
    - product owner
  weak:
    - product management.*intern
  negative:
    - product marketing
    - product designer
    - product engineer
  is_software: false

product.design:
  exemplars:
    - Product Design Intern
    - UX Designer Intern
    - UI/UX Designer Intern
    - Product Designer Intern
  strong:
    - product designer
    - ux designer
    - ui/ux designer
    - ui designer
    - user experience designer
  weak:
    - product design.*intern
    - (ux|ui).*design.*intern
    - user experience.*intern
  negative:
    - graphic designer
    - industrial designer
  is_software: false

product.analyst:
  exemplars:
    - Product Analyst Intern
    - Product Operations Analyst Intern
  strong:
    - product analyst
    - product operations analyst
  weak:
    - product analytics.*intern
  negative:
    - product marketing analyst
  is_software: false

# Scoped tightly to explicit "consultant"/"consulting" titles — "business
# analyst" alone is not strong-matched here, since that title is at least
# as common at a product company (business.general) as at a consulting
# firm, and admitting it here would misclassify the former.
consulting.strategy:
  exemplars:
    - Strategy Consulting Intern
    - Management Consulting Intern
    - Associate Consultant Intern
  strong:
    - management consultant
    - strategy consultant
    - management consulting intern
    - strategy consulting intern
    - associate consultant
  weak:
    - consulting.*intern
  is_software: false

# advocacy.solutions (checked earlier in file order, so it wins any real
# clash) is reserved for genuine hands-on technical building — "technical
# consultant" is its own strong pattern there, not duplicated here. This
# family is the advisory-not-hands-on side: scoping/delivering a
# technology-enabled business change without writing the implementation.
consulting.technology:
  exemplars:
    - Technology Consulting Intern
    - Digital Consulting Intern
    - Business Technology Analyst Intern
