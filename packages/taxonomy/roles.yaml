# Tier 0 role-family patterns. docs/07-normalization-taxonomy.md section 4
# calls for ~400 curated patterns across all 20 leaves, handling ~70% of
# titles outright, with Tier 1 (embeddings) and Tier 2 (LLM) handling the
# rest. This is the P1 scope-down: enough patterns to classify the roles the
# seeded Greenhouse boards actually post, not the full catalog. Extend
# directly; the loader (packages/taxonomy/roles.go) does not change.
#
# advocacy.* (P2 Phase H) carries `requires: technical_evidence` — docs/07
# section 4's gate unique to this family, checked by
# apps/collector/internal/classify.HasTechnicalEvidence against the
# description, not the title. A strong/weak title match on a
# requires:technical_evidence family whose description fails the gate
# escalates to Tier 2 (apps/brain's classify_tier2 consumer) rather than
# being admitted or silently dropped — docs/07's own "~25% escalation
# versus the 8% baseline" for this family specifically.
#
# Matched against the normalized title (apps/collector/internal/normalize,
# lowercased, whitespace-collapsed). strong patterns are substring matches
# checked first, in file order; the first family with a strong match wins.
# weak patterns are checked only if no family strong-matched. negative
# patterns on a family veto an otherwise-matching strong/weak pattern for
# that family, so "backend team recruiter" does not become swe.backend.
#
# `exemplars` (P2 Phase D) is Python-only data — apps/brain embeds these
# once at startup and Tier 1 nearest-neighbor matches a job's own embedding
# against them when Tier 0's strong/weak/negative rules above land on a low-
# or zero-confidence result. Go's yaml.Unmarshal (non-strict) ignores this
# key entirely, so one file stays the single source of truth for both
# languages rather than duplicating the family list. Scoped to 5-6 titles
# per family, not docs/07's full 20-40 — real coverage, hand-picked from
# realistic internship/new-grad title patterns, not a placeholder list.

swe.backend:
  exemplars:
