# Minimal single-binary Tempo config — local disk storage, no object
# store (ADR-014's zero-cost constraint), 7-day retention per ADR-011's
# stack table.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 168h # 7 days, ADR-011
