# Production stack. One Compose project, one host. See docs/15-infrastructure-deployment.md
# section 2 and ADR-014.
#
# WHAT IS DELIBERATELY ABSENT
#
# docs/15 section 2 lists the full topology: web, brain, notifier, ollama, and
# the observability stack. None of them are here, because none of them do
# anything yet. A Compose file full of containers that log "not implemented" and
# restart teaches you to ignore a restarting container, which is the same mistake
# as a CI workflow full of skipped jobs. Each service joins on the milestone that
# gives it work:
#
#   notifier, brain          P1  first real notification
#   ollama                   P2  local LLM tier
#   web, observability       P3  dashboard and the metrics worth looking at
#
# The collector is here despite not fetching anything, because the dead-man's
# switch is a P0 deliverable: "Scout silently stopped and nobody noticed" is a
# failure mode from the moment there is a host, not from the moment there is
# something worth watching it do.
#
# NOTHING PUBLISHES A HOST PORT
#
# There is no `ports:` key in this file and there must never be one.
# infra/scripts/health-gate.sh fails the deploy if one appears. The ingress is:
#
#   tailnet → tailscaled on the host (`tailscale serve`, TLS terminated with a
#             real cert from `tailscale cert`) → caddy at a fixed address on this
#             bridge network → api
#
# The host can route to a bridge-network container address directly, which is
# what lets the middle hop work with no published port. See infra/caddy/Caddyfile
# and `make tailscale-serve`.
#
# ARM64. The Oracle A1 host and the MacBook are both ARM64, so local and
# production are the same architecture and there is no cross-build to get wrong.
# SCOUT_PLATFORM exists only as an escape hatch for a fallback host that is not.

name: scout

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      # Bounded, because a log that fills the disk takes the database down with
      # it and "disk full" is a documented disaster scenario (docs/15 section 10).
      max-size: "10m"
      max-file: "5"

x-go-service: &go-service
  <<: *hardening
  platform: ${SCOUT_PLATFORM:-linux/arm64}
  build:
    context: ../..
    dockerfile: infra/docker/go-service.Dockerfile
  env_file:
    - ${SCOUT_ENV_FILE:-../../.env}
  tmpfs:
    # The only writable path in a read-only container. The Go services write the
    # liveness file here and nothing else.
    - /tmp:size=16m,mode=1777
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- ingress ---

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    platform: ${SCOUT_PLATFORM:-linux/arm64}
    networks:
      scout:
        # Fixed, because `tailscale serve` on the host points at this address
        # and a DHCP-assigned container IP would silently break the ingress on
        # every recreate.
        ipv4_address: 172.28.0.10
    # The official image runs `setcap cap_net_bind_service=+ep` on the binary so
    # it can bind 80 and 443. A file with capabilities in its xattrs cannot be
    # exec'd at all when the container's bounding set does not include them —
    # the kernel returns EPERM before Caddy's first line runs, and the container
    # restart-loops with "operation not permitted".
    #
    # So this is not a capability Caddy uses here: it listens on 8080 and binds
    # nothing privileged. It is the capability the *binary* declares, and it has
    # to be in the bounding set for exec to succeed.
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/_caddy/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy

  # --------------------------------------------------------------- services ---

  api:
    <<: *go-service
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: api
    networks: [scout]
    environment:
      SCOUT_API_ADDR: ":8080"
      SCOUT_ENV: production
    healthcheck:
      # The binary probes its own /health over loopback. distroless has no shell
      # and no curl, and a real HTTP probe beats a process-liveness check.
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 512m

  collector:
    <<: *go-service
    build:
      context: ../..
      dockerfile: infra/docker/go-service.Dockerfile
      args:
        SERVICE: collector
    networks: [scout]
    environment:
      SCOUT_ENV: production
      # Production fetches live sources; only local is fixtures-only.
      SCOUT_FIXTURES_ONLY: "false"
      # redis:6379 and postgres:5432 are the container-network addresses, not
      # the host-side ones from the environment file — see the same note in
      # infra/compose/local.yml. The password is the one exception: it comes
      # from the environment file (SCOUT_PG_PASSWORD), the same variable
      # postgres's own service block below requires, so the two can never
      # drift out of sync with each other.
      SCOUT_REDIS_URL: redis://redis:6379/0
      SCOUT_DATABASE_URL: postgres://${SCOUT_PG_USER:-scout}:${SCOUT_PG_PASSWORD:?SCOUT_PG_PASSWORD must be set}@postgres:5432/${SCOUT_PG_DATABASE:-scout}?sslmode=disable
      # Public by design (SCOUT-LEGAL-003: published in every request's
      # User-Agent), so it is fixed here rather than pulled from the
      # SOPS-encrypted environment file the way SCOUT_COLLECTOR_OPERATOR_EMAIL
      # is — one fewer secret to rotate for a value that was never secret.
      SCOUT_COLLECTOR_CONTACT_URL: https://github.com/kelyon/scout
      # SCOUT_COLLECTOR_OPERATOR_EMAIL comes from the environment file: it is
      # the operator's real address, not a value this public repository pins.
    healthcheck:
      # Checks that the heartbeat loop is still ticking, not merely that the
      # process exists. Superseded at P1 by the heartbeat-row age check in
      # docs/15 section 2, which proves it is actually polling.
      test: ["CMD", "/app/app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1g

  # ------------------------------------------------------------------ stores ---

  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg16
    platform: ${SCOUT_PLATFORM:-linux/arm64}
    networks: [scout]
    env_file:
      - ${SCOUT_ENV_FILE:-../../.env}
    environment:
      POSTGRES_USER: ${SCOUT_PG_USER:-scout}
      POSTGRES_PASSWORD: ${SCOUT_PG_PASSWORD:?SCOUT_PG_PASSWORD must be set in the environment file}
      POSTGRES_DB: ${SCOUT_PG_DATABASE:-scout}
      # Must match infra/compose/local.yml, or index ordering differs between
      # development and production and produces test failures that look like
      # logic bugs.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      # The socket directory. Postgres will not start without a writable one,
      # and the root filesystem is read-only.
      - /var/run/postgresql:size=16m,mode=0700,uid=999,gid=999
    # The official image's entrypoint starts as root, fixes ownership on the
    # data directory, and drops to the postgres user. These five are what that
    # requires; everything else stays dropped.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    command:
      # 24 GB of RAM, so these are the generous values docs/15 section 2
      # specifies rather than the 8 GB developer-machine values in local.yml.
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - effective_cache_size=3GB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500ms
      - -c
      - shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCOUT_PG_USER:-scout} -d ${SCOUT_PG_DATABASE:-scout}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 4g

  redis:
    <<: *hardening
    image: redis:7-alpine
    platform: ${SCOUT_PLATFORM:-linux/arm64}
    networks: [scout]
    user: "999:1000"
    tmpfs:
      - /tmp:size=16m,mode=1777
    command:
      # No persistence. Redis holds nothing durable (AGENTS.md rule 8), and
      # there is a chaos test that flushes it and asserts zero data loss. Turning
      # persistence on here would make that test pass for the wrong reason.
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m

  # ------------------------------------------------------------------- tools ---

  # Not started by `up`. Run explicitly:
  #   docker compose --profile tools run --rm migrate up
  # which is what `make migrate` and the deploy script do.
  migrate:
    image: migrate/migrate:v4.18.1
    platform: ${SCOUT_PLATFORM:-linux/arm64}
    profiles: [tools]
    networks: [scout]
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ../migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${SCOUT_PG_USER:-scout}:${SCOUT_PG_PASSWORD:?SCOUT_PG_PASSWORD must be set}@postgres:5432/${SCOUT_PG_DATABASE:-scout}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

networks:
  scout:
    # A literal name rather than Compose's default project-prefixed
    # "scout_scout" — infra/compose/observability.yml (P3) is a second
    # file merged in via `-f`, and it references this network by this
    # exact literal name so its containers can resolve api/collector/etc.
    # by service name. See that file's own comment.
    name: scout
    driver: bridge
    ipam:
      config:
        # Explicit, so caddy's address is predictable and so the subnet does not
        # collide with the tailnet's 100.64.0.0/10.
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
