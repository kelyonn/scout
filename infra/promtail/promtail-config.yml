# Ships every container's stdout (the structured JSON slog already
# writes — apps/*/cmd/main.go's slog.NewJSONHandler) into Loki. Docker
# service discovery over the socket, not a host log-file path: it works
# identically regardless of the host's logging-driver configuration, and
# needs only a read-only socket mount rather than knowing where Docker
# happens to keep json-file logs on this particular host/OS.

server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Container name (Compose sets this to <project>-<service>-<n>) is
      # the one label worth keeping — everything else about the container
      # is noise Loki would otherwise index and pay for.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
