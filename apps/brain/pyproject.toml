[project]
name = "scout-brain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "prometheus-client>=0.21.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scout-riverpy",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "types-PyYAML>=6.0.12",
]

[tool.uv.sources]
scout-riverpy = { path = "../../packages/riverpy", editable = true }

[tool.mypy]
strict = true
files = ["scout_brain", "tests", "../../evals"]

[[tool.mypy.overrides]]
# No type stubs upstream for either.
module = ["fastembed.*", "psycopg.*"]
ignore_missing_imports = true
