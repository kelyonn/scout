version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck    # context.Context threaded through I/O
    - copyloopvar
    - errorlint       # %w rather than %v for wrapping
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx           # no HTTP request without a context
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wrapcheck       # errors crossing a package boundary carry context

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: context-as-argument   # context.Context is the first parameter
        - name: error-strings
        - name: error-return
        - name: exported
          arguments: ["disableStutteringCheck"]
    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - .Wrap(
        - .Wrapf(

  exclusions:
    rules:
      # Generated sqlc code is not ours to lint.
      - path: packages/db/gen/
        linters: [revive, gocritic, wrapcheck, gosec, errorlint, unconvert]
      # Tests may use raw SQL and long functions.
      - path: _test\.go$
        linters: [wrapcheck, gosec, contextcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/kelyon/scout
